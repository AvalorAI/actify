name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # release.yml runs this same gate against the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain used to generate the trybuild .stderr files. Compiler error
  # output changes between rustc releases, so the trybuild job pins this
  # version. Keep it at the version contributors develop on, or snapshots that
  # quote a rustc diagnostic cannot match both CI and a local run. To regenerate
  # the .stderr files, see CONTRIBUTING.md.
  TRYBUILD_TOOLCHAIN: "1.97.1"
  # The oldest toolchain the published crates support, matching the
  # rust-version in [workspace.package].
  MSRV: "1.85"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Trybuild tests are skipped here (see the trybuild job): they pin exact
      # rustc diagnostics and only run on the pinned toolchain.
      - run: cargo test --workspace --all-features

  # Workspace feature unification means `cargo test --workspace` always builds
  # actify with the profiler feature enabled (actify-test requires it). This job
  # is the only place the default (no-feature) build of actify is compiled.
  test-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Test default features
        run: cargo test -p actify
      - name: Test profiler feature
        run: cargo test -p actify --features profiler

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Docs with every feature
        run: cargo doc --workspace --no-deps --all-features
      # Feature-gated items cannot be linked from text that is always compiled,
      # so the default build has to be checked separately.
      - name: Docs with default features
        run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # check, not test: building dev-dependencies would raise the effective MSRV.
      - run: cargo check -p actify -p actify-macros --all-features

  trybuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.TRYBUILD_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test -p actify-test --test unsupported_arg_types
        env:
          TRYBUILD_TESTS: "1"
