[package]
name = "actify"
version = "0.8.3"
edition = "2024"
rust-version = "1.85"
description = "An intuitive actor model with minimal boilerplate"
license = "MIT"
repository = "https://github.com/AvalorAI/actify"
documentation = "https://docs.rs/actify/latest/actify/"
readme = "../README.md"

[dependencies]
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
log = "0.4"
actify-macros = { path = "../actify-macros", version = "0.5.0" }

[dev-dependencies]
tokio = { version = "1.44.1", features = ["test-util"] }

[features]
default = []
profiler = []

[package.metadata.docs.rs]
# Build with every feature so `profiler` items appear, tagged with the feature
# they need.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
