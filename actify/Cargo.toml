[package]
name = "actify"
version = "0.8.3"
description = "An intuitive actor model with minimal boilerplate"
documentation = "https://docs.rs/actify/latest/actify/"
readme = "../README.md"
keywords = ["actor", "async", "tokio", "concurrency", "macro"]
categories = ["asynchronous", "concurrency"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["std"] }
actify-macros.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[features]
default = []
# Emits the events as log records whenever no tracing subscriber is set.
log = ["tracing/log"]
profiler = []

[package.metadata.docs.rs]
# Build with every feature so the profiler items are documented.
all-features = true
