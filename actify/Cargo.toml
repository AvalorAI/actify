[package]
name = "actify"
version = "0.8.3"
description = "An intuitive actor model with minimal boilerplate"
documentation = "https://docs.rs/actify/latest/actify/"
readme = "../README.md"
keywords = ["actor", "async", "tokio", "concurrency", "macro"]
categories = ["asynchronous", "concurrency"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures-core.workspace = true
log.workspace = true
actify-macros.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# The throttle combinator in the stream doctests needs the time feature, which
# the library itself does not.
tokio-stream = { workspace = true, features = ["time"] }

[features]
default = []
profiler = []

[package.metadata.docs.rs]
# Build with every feature so the profiler items are documented.
all-features = true
